<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Apex Hospitality">
  <!-- The mark as supplied: on its own dark ground, so the .45 and .22 faces
       still read. On a transparent ground they wash out to nothing against a
       light browser tab. #06080F is the ground the pack's app icon uses. -->
  <rect width="100" height="100" rx="22" fill="#06080F"/>
  <g transform="translate(50 50) scale(.72) translate(-50 -48)">
    <polygon points="50,11 9,85 50,63" fill="#2A7BFF" opacity=".45"/>
    <polygon points="50,11 91,85 50,63" fill="#2A7BFF"/>
    <polygon points="9,85 91,85 50,63" fill="#2A7BFF" opacity=".22"/>
  </g>
</svg>
