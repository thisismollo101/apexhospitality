<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Apex Hospitality">
  <!--
    Served at /icon.svg for both root layouts, because it sits at the app root
    rather than inside (site) or (samples). Before this, /favicon.ico 404'd on
    every route in the app.

    The apex itself, in the header's two tones: #0b0b0c is --fg and #5f9bef is
    --brandblue, matching "Apex Hospitality" in the nav. Hardcoded rather than
    tokenised — an icon is fetched as a standalone document and never sees the
    stylesheet.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0b0c" />
  <path d="M16 7.5 L24.5 24 H19.6 L16 16.6 L12.4 24 H7.5 Z" fill="#fff" />
  <path d="M16 16.6 L19.6 24 H12.4 Z" fill="#5f9bef" />
</svg>
