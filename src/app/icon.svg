<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Apex Hospitality">
  <!-- No ground: the tab icon sits on whatever the browser paints behind it.
       The pack draws one ink at .45 / 1 / .22, which only reads that way over
       near-black — over a light tab the two minor faces wash out and the mark
       becomes a single triangle. So the same three tones are stated outright,
       flattened onto #06080F exactly as ApexMark does in the nav. Same drawn
       mark, no square behind it. -->
  <polygon points="50,11 9,85 50,63" fill="#163C7B"/>
  <polygon points="50,11 91,85 50,63" fill="#2A7BFF"/>
  <polygon points="9,85 91,85 50,63" fill="#0E2144"/>
</svg>
